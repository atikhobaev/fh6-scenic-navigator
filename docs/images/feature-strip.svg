<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">FH6 Scenic Navigator features</title>
  <desc id="desc">Cards showing Drive mode, Plan mode and offline map data</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081322"/><stop offset="1" stop-color="#0c1830"/></linearGradient><linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f2940"/><stop offset="1" stop-color="#0a1b2e"/></linearGradient></defs>
  <rect width="1400" height="360" rx="24" fill="url(#bg)"/>
  <text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#64748b" letter-spacing="2">BUILT FOR A SECOND SCREEN</text>
  <g transform="translate(62 96)"><rect width="400" height="210" rx="22" fill="url(#c1)" stroke="#1e4058"/><circle cx="54" cy="54" r="26" fill="#082b36" stroke="#22d3ee" stroke-opacity="0.45"/><path d="M41 56h22m-8-8 8 8-8 8" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#67e8f9" letter-spacing="1.6">DRIVE</text><text x="96" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#f8fafc">Low-distraction navigation</text><text x="34" y="124" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#94a3b8">Telemetry-aware guidance, target name,</text><text x="34" y="150" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#94a3b8">turn prompts and road-following routes.</text></g>
  <g transform="translate(500 96)"><rect width="400" height="210" rx="22" fill="url(#c1)" stroke="#263d69"/><circle cx="54" cy="54" r="26" fill="#14233e" stroke="#60a5fa" stroke-opacity="0.45"/><path d="M40 41h28v25H40zM45 47h18M45 53h12M45 59h15" fill="none" stroke="#60a5fa" stroke-width="2.4" stroke-linecap="round"/><text x="96" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#93c5fd" letter-spacing="1.6">PLAN</text><text x="96" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#f8fafc">Map-first route planning</text><text x="34" y="124" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#94a3b8">Search, filters, POI popovers, favorites,</text><text x="34" y="150" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#94a3b8">route ordering and saved custom places.</text></g>
  <g transform="translate(938 96)"><rect width="400" height="210" rx="22" fill="url(#c1)" stroke="#403766"/><circle cx="54" cy="54" r="26" fill="#211b3c" stroke="#a78bfa" stroke-opacity="0.45"/><path d="M42 64c0-14 7-27 12-27s12 13 12 27M43 57h22M49 45h10" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round"/><text x="96" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#c4b5fd" letter-spacing="1.6">OFFLINE</text><text x="96" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#f8fafc">823 places + WVAN graph</text><text x="34" y="124" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#94a3b8">Bundled catalog and directed navigation</text><text x="34" y="150" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#94a3b8">data — no runtime POI scraping required.</text></g>
</svg>
